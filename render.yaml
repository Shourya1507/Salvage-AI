services:
  - type: web
    name: salvage-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: EXECUTOR_ENABLED
        value: "true"
      - key: ALLOW_LIVE
        value: "false"
      - key: PAYPAL_ENV
        value: "sandbox"
      - key: WEBHOOK_VERIFY
        value: "false"
      - key: ADMIN_TOKEN
        value: "admin_secret_token_123"
      - key: PAYPAL_CLIENT_ID
        value: "sandbox_client_id_demo"
      - key: PAYPAL_CLIENT_SECRET
        value: "sandbox_client_secret_demo"
      - key: GEMINI_API_KEY
        value: "demo_key"
      - key: LLM_MODEL
        value: "gemini-2.5-flash"

